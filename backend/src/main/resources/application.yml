server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: SEFORGE_SESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: seforge-backend
  profiles:
    default: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 3s
  session:
    store-type: redis
    timeout: 8h
    redis:
      namespace: seforge:session
      repository-type: indexed
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-} requestId=%X{requestId:-}]"

seforge:
  security:
    login-rate-limit:
      max-attempts: ${SEFORGE_LOGIN_RATE_LIMIT_MAX_ATTEMPTS:5}
      window: ${SEFORGE_LOGIN_RATE_LIMIT_WINDOW:15m}
    api-rate-limit:
      general: ${SEFORGE_API_RATE_LIMIT_GENERAL:600}
      expensive: ${SEFORGE_API_RATE_LIMIT_EXPENSIVE:30}
      upload: ${SEFORGE_API_RATE_LIMIT_UPLOAD:20}
      window: ${SEFORGE_API_RATE_LIMIT_WINDOW:1m}
  ai:
    enabled: ${SEFORGE_AI_ENABLED:false}
    deepseek-api-key: ${DEEPSEEK_API_KEY:}
    deepseek-base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
    fast-model: ${SEFORGE_FAST_MODEL:deepseek-chat}
    reasoning-model: ${SEFORGE_REASONING_MODEL:deepseek-reasoner}
    coding-model: ${SEFORGE_CODING_MODEL:deepseek-chat}
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    fallback-model: ${SEFORGE_FALLBACK_MODEL:qwen-plus}
    embedding-model: ${SEFORGE_EMBEDDING_MODEL:text-embedding-v2}
    embedding-dimension: ${SEFORGE_EMBEDDING_DIMENSION:1536}
    timeout: ${SEFORGE_AI_TIMEOUT:45s}
    max-retries: ${SEFORGE_AI_MAX_RETRIES:3}
  storage:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:seforge}
    secret-key: ${MINIO_SECRET_KEY:seforge-local-secret}
    bucket: ${MINIO_BUCKET:seforge}
    course-quota-bytes: ${SEFORGE_STORAGE_COURSE_QUOTA_BYTES:2147483648}
    attachment-user-quota-bytes: ${SEFORGE_STORAGE_ATTACHMENT_USER_QUOTA_BYTES:536870912}
    attachment-course-quota-bytes: ${SEFORGE_STORAGE_ATTACHMENT_COURSE_QUOTA_BYTES:2147483648}
  vector-store:
    enabled: ${SEFORGE_VECTOR_STORE_ENABLED:false}
    host: ${MILVUS_HOST:localhost}
    port: ${MILVUS_PORT:19530}
    collection-prefix: ${MILVUS_COLLECTION_PREFIX:${MILVUS_COLLECTION:seforge_chunks}}
    active-version: ${SEFORGE_VECTOR_ACTIVE_VERSION:}
    write-version: ${SEFORGE_VECTOR_WRITE_VERSION:}
    reconciliation-page-size: ${SEFORGE_VECTOR_RECONCILIATION_PAGE_SIZE:1000}
    reconciliation-batch-size: ${SEFORGE_VECTOR_RECONCILIATION_BATCH_SIZE:100}
    reconciliation-initial-delay: ${SEFORGE_VECTOR_RECONCILIATION_INITIAL_DELAY:5m}
    reconciliation-interval: ${SEFORGE_VECTOR_RECONCILIATION_INTERVAL:15m}
  jobs:
    enabled: ${SEFORGE_JOBS_ENABLED:false}
    stream: ${SEFORGE_JOB_STREAM:seforge:jobs}
    group: ${SEFORGE_JOB_GROUP:seforge-workers}
    max-attempts: ${SEFORGE_JOB_MAX_ATTEMPTS:3}
    lease-duration: ${SEFORGE_JOB_LEASE_DURATION:10m}
    queued-stale-after: ${SEFORGE_JOB_QUEUED_STALE_AFTER:2m}
    recovery-batch-size: ${SEFORGE_JOB_RECOVERY_BATCH_SIZE:100}
  sonar:
    enabled: ${SEFORGE_SONAR_ENABLED:false}
    server-url: ${SEFORGE_SONAR_SERVER_URL:http://localhost:9000}
    token: ${SEFORGE_SONAR_TOKEN:}
    scanner-executable: ${SEFORGE_SONAR_SCANNER_EXECUTABLE:sonar-scanner}
    scanner-timeout: ${SEFORGE_SONAR_SCANNER_TIMEOUT:3m}
    compute-timeout: ${SEFORGE_SONAR_COMPUTE_TIMEOUT:2m}
    api-timeout: ${SEFORGE_SONAR_API_TIMEOUT:15s}
    poll-interval: ${SEFORGE_SONAR_POLL_INTERVAL:1s}
    max-findings: ${SEFORGE_SONAR_MAX_FINDINGS:100}
    max-process-output-bytes: ${SEFORGE_SONAR_MAX_OUTPUT_BYTES:262144}

resilience4j:
  retry:
    instances:
      ai-provider:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      ai-provider:
        sliding-window-size: 20
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
