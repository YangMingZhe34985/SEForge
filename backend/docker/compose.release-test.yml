# Isolated release verification only. Always use a distinct --project-name and generated env.
services:
  frontend:
    ports: !override
      - "127.0.0.1:${SEFORGE_HTTP_PORT}:8443"
    volumes:
      - ${SEFORGE_RELEASE_DIR}/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${SEFORGE_RELEASE_DIR}/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
  api:
    environment:
      SEFORGE_AI_ENABLED: "true"
      DEEPSEEK_API_KEY: release-stub-not-a-real-key
      DASHSCOPE_API_KEY: release-stub-not-a-real-key
      DEEPSEEK_BASE_URL: http://provider-stub:8090/v1
      DASHSCOPE_BASE_URL: http://provider-stub:8090/v1
      SEFORGE_EMBEDDING_DIMENSION: "32"
      SEFORGE_AI_MAX_RETRIES: "0"
      SEFORGE_AI_TIMEOUT: 90s
  worker:
    environment:
      SEFORGE_AI_ENABLED: "true"
      DEEPSEEK_API_KEY: release-stub-not-a-real-key
      DASHSCOPE_API_KEY: release-stub-not-a-real-key
      DEEPSEEK_BASE_URL: http://provider-stub:8090/v1
      DASHSCOPE_BASE_URL: http://provider-stub:8090/v1
      SEFORGE_EMBEDDING_DIMENSION: "32"
      SEFORGE_AI_MAX_RETRIES: "0"
      SEFORGE_AI_TIMEOUT: 90s
      SEFORGE_JOB_LEASE_DURATION: 15s
      SEFORGE_JOB_QUEUED_STALE_AFTER: 15s
      SEFORGE_JOBS_READ_BATCH_SIZE: "1"
  mysql:
    ports: !reset []
    networks: !override [data]
  redis:
    ports: !reset []
    networks: !override [data]
  provider-stub:
    image: node:22.14.0-alpine3.21
    command: [node, /fixture/provider.mjs]
    volumes:
      - ../../docs/release/provider.mjs:/fixture/provider.mjs:ro
    networks: [data]
    read_only: true
    user: "1000:1000"
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8090/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: {cpus: "1.00", memory: 256M}
