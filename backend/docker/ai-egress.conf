server {
    listen 8080;
    server_name _;
    # Resolve providers only when a request is made. This keeps the core stack
    # startable in degraded/offline mode when AI is disabled or DNS is unavailable.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $deepseek_host api.deepseek.com;
    set $dashscope_host dashscope.aliyuncs.com;

    access_log off;
    server_tokens off;
    client_max_body_size 2m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /deepseek/ {
        rewrite ^/deepseek/(.*)$ /$1 break;
        proxy_pass https://$deepseek_host$uri$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name $deepseek_host;
        proxy_set_header Host $deepseek_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location /dashscope/ {
        rewrite ^/dashscope/(.*)$ /$1 break;
        proxy_pass https://$dashscope_host$uri$is_args$args;
        proxy_ssl_server_name on;
        proxy_ssl_name $dashscope_host;
        proxy_set_header Host $dashscope_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        return 404;
    }
}
