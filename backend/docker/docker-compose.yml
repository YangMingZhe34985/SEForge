name: seforge

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-environment: &backend-environment
  TZ: UTC
  LANG: C.UTF-8
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-seforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
  SPRING_DATASOURCE_USERNAME: ${MYSQL_APP_USERNAME:-seforge}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
  SPRING_DATA_REDIS_HOST: redis
  SPRING_DATA_REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
  SPRING_SESSION_REDIS_NAMESPACE: seforge:session
  SPRING_SESSION_REDIS_REPOSITORY_TYPE: indexed
  SPRING_FLYWAY_ENABLED: "true"
  SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
  SERVER_SHUTDOWN: graceful
  SERVER_FORWARD_HEADERS_STRATEGY: framework
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SEFORGE_API_RATE_LIMIT_GENERAL: ${SEFORGE_API_RATE_LIMIT_GENERAL:-600}
  SEFORGE_API_RATE_LIMIT_EXPENSIVE: ${SEFORGE_API_RATE_LIMIT_EXPENSIVE:-30}
  SEFORGE_API_RATE_LIMIT_UPLOAD: ${SEFORGE_API_RATE_LIMIT_UPLOAD:-20}
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-seforge-app}
  MINIO_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env}
  MINIO_BUCKET: ${MINIO_APP_BUCKET:-seforge}
  SEFORGE_STORAGE_COURSE_QUOTA_BYTES: ${SEFORGE_STORAGE_COURSE_QUOTA_BYTES:-2147483648}
  SEFORGE_STORAGE_ATTACHMENT_USER_QUOTA_BYTES: ${SEFORGE_STORAGE_ATTACHMENT_USER_QUOTA_BYTES:-536870912}
  SEFORGE_STORAGE_ATTACHMENT_COURSE_QUOTA_BYTES: ${SEFORGE_STORAGE_ATTACHMENT_COURSE_QUOTA_BYTES:-2147483648}
  SEFORGE_VECTOR_STORE_ENABLED: ${MILVUS_ENABLED:-true}
  MILVUS_HOST: milvus
  MILVUS_PORT: "19530"
  MILVUS_COLLECTION_PREFIX: ${MILVUS_COLLECTION_PREFIX:-seforge_chunks}
  SEFORGE_VECTOR_ACTIVE_VERSION: ${SEFORGE_VECTOR_ACTIVE_VERSION:-text-embedding-v2}
  SEFORGE_VECTOR_WRITE_VERSION: ${SEFORGE_VECTOR_WRITE_VERSION:-text-embedding-v2}
  SEFORGE_VECTOR_RECONCILIATION_INTERVAL: ${SEFORGE_VECTOR_RECONCILIATION_INTERVAL:-15m}
  SEFORGE_AI_ENABLED: ${SEFORGE_AI_ENABLED:-false}
  SEFORGE_JOBS_ENABLED: "false"
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
  DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
  DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  SEFORGE_FAST_MODEL: ${SEFORGE_FAST_MODEL:-deepseek-chat}
  SEFORGE_REASONING_MODEL: ${SEFORGE_REASONING_MODEL:-deepseek-reasoner}
  SEFORGE_CODING_MODEL: ${SEFORGE_CODING_MODEL:-deepseek-chat}
  SEFORGE_FALLBACK_MODEL: ${SEFORGE_FALLBACK_MODEL:-qwen-plus}
  SEFORGE_EMBEDDING_MODEL: ${SEFORGE_EMBEDDING_MODEL:-text-embedding-v2}
  SEFORGE_EMBEDDING_DIMENSION: ${SEFORGE_EMBEDDING_DIMENSION:-1536}
  SEFORGE_AI_TIMEOUT: ${SEFORGE_AI_TIMEOUT:-45s}
  SEFORGE_AI_MAX_RETRIES: ${SEFORGE_AI_MAX_RETRIES:-3}

x-backend-service: &backend-service
  image: seforge/backend:${SEFORGE_IMAGE_TAG:-local}
  build:
    context: ..
    dockerfile: Dockerfile
    target: runtime
  init: true
  restart: unless-stopped
  stop_grace_period: 45s
  environment: *backend-environment
  volumes:
    - app-data:/app/data
  read_only: true
  tmpfs:
    - /app/tmp:size=256m,uid=10001,gid=10001,mode=1770
  networks:
    - edge
    - data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  security_opt:
    - no-new-privileges:true
  logging: *default-logging
  deploy:
    resources:
      limits:
        cpus: "2.00"
        memory: 2G
      reservations:
        memory: 512M

services:
  frontend:
    image: seforge/frontend:${SEFORGE_IMAGE_TAG:-local}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SEFORGE_BIND_ADDRESS:-0.0.0.0}:${SEFORGE_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          memory: 32M

  api:
    <<: *backend-service
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: ${SEFORGE_API_PROFILES:-prod}
      SERVER_PORT: "8080"
      SEFORGE_BOOTSTRAP_ADMIN_EMAIL: ${SEFORGE_BOOTSTRAP_ADMIN_EMAIL:-}
      SEFORGE_BOOTSTRAP_ADMIN_PASSWORD: ${SEFORGE_BOOTSTRAP_ADMIN_PASSWORD:-}
      SEFORGE_BOOTSTRAP_ADMIN_USERNAME: ${SEFORGE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SEFORGE_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${SEFORGE_BOOTSTRAP_ADMIN_DISPLAY_NAME:-SEForge Administrator}
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  worker:
    <<: *backend-service
    image: seforge/worker:${SEFORGE_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: worker-runtime
    environment:
      <<: *backend-environment
      SPRING_PROFILES_ACTIVE: ${SEFORGE_WORKER_PROFILES:-prod,worker}
      SERVER_PORT: "8081"
      SEFORGE_JOBS_ENABLED: "true"
      SEFORGE_SONAR_ENABLED: ${SEFORGE_SONAR_ENABLED:-false}
      SEFORGE_SONAR_SERVER_URL: ${SEFORGE_SONAR_SERVER_URL:-http://sonarqube:9000}
      SEFORGE_SONAR_TOKEN: ${SEFORGE_SONAR_TOKEN:-}
      SEFORGE_SONAR_SCANNER_EXECUTABLE: ${SEFORGE_SONAR_SCANNER_EXECUTABLE:-sonar-scanner}
      # The worker has no direct Internet route. Only these fixed provider paths
      # are reachable through the allow-listed reverse proxy below; the scanner
      # subprocess receives neither provider URLs nor credentials.
      DEEPSEEK_BASE_URL: ${SEFORGE_WORKER_DEEPSEEK_BASE_URL:-http://ai-egress:8080/deepseek/v1}
      DASHSCOPE_BASE_URL: ${SEFORGE_WORKER_DASHSCOPE_BASE_URL:-http://ai-egress:8080/dashscope/compatible-mode/v1}
    volumes: []
    tmpfs:
      - /app/tmp:size=512m,uid=1000,gid=1000,mode=1770
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      milvus:
        condition: service_healthy
      ai-egress:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  ai-egress:
    image: nginxinc/nginx-unprivileged:1.27.4-alpine
    restart: unless-stopped
    volumes:
      - ./ai-egress.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      - edge
      - data
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
      - /var/cache/nginx:size=8m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M

  k6:
    image: grafana/k6:1.0.0
    profiles: [load-test]
    restart: "no"
    command: ["run", "/scripts/mixed-load.js"]
    environment:
      K6_NO_COLOR: "true"
      SEFORGE_LOAD_TEST_BASE_URL: ${SEFORGE_LOAD_TEST_BASE_URL:-http://frontend:8080}
      SEFORGE_LOAD_TEST_HEALTH_PATH: ${SEFORGE_LOAD_TEST_HEALTH_PATH:-/healthz}
      SEFORGE_LOAD_TEST_COURSE_ID: ${SEFORGE_LOAD_TEST_COURSE_ID:-}
      SEFORGE_LOAD_TEST_IDENTIFIER: ${SEFORGE_LOAD_TEST_IDENTIFIER:-}
      SEFORGE_LOAD_TEST_PASSWORD: ${SEFORGE_LOAD_TEST_PASSWORD:-}
      SEFORGE_LOAD_TEST_USER_PREFIX: ${SEFORGE_LOAD_TEST_USER_PREFIX:-}
      SEFORGE_LOAD_TEST_USER_COUNT: ${SEFORGE_LOAD_TEST_USER_COUNT:-200}
      SEFORGE_LOAD_TEST_TEACHER_IDENTIFIER: ${SEFORGE_LOAD_TEST_TEACHER_IDENTIFIER:-}
      SEFORGE_LOAD_TEST_TEACHER_PASSWORD: ${SEFORGE_LOAD_TEST_TEACHER_PASSWORD:-}
      SEFORGE_LOAD_TEST_IDLE_VUS: ${SEFORGE_LOAD_TEST_IDLE_VUS:-125}
      SEFORGE_LOAD_TEST_API_VUS: ${SEFORGE_LOAD_TEST_API_VUS:-50}
      SEFORGE_LOAD_TEST_SSE_VUS: ${SEFORGE_LOAD_TEST_SSE_VUS:-20}
      SEFORGE_LOAD_TEST_JOB_VUS: ${SEFORGE_LOAD_TEST_JOB_VUS:-5}
      SEFORGE_LOAD_TEST_DURATION: ${SEFORGE_LOAD_TEST_DURATION:-2m}
      SEFORGE_LOAD_TEST_RAMP_DURATION: ${SEFORGE_LOAD_TEST_RAMP_DURATION:-20s}
      SEFORGE_LOAD_TEST_ACTIVE_START: ${SEFORGE_LOAD_TEST_ACTIVE_START:-20s}
      SEFORGE_LOAD_TEST_HEAVY_START: ${SEFORGE_LOAD_TEST_HEAVY_START:-30s}
      SEFORGE_LOAD_TEST_SSE_TIMEOUT: ${SEFORGE_LOAD_TEST_SSE_TIMEOUT:-2m}
      SEFORGE_LOAD_TEST_SSE_MAX_DURATION: ${SEFORGE_LOAD_TEST_SSE_MAX_DURATION:-3m}
      SEFORGE_LOAD_TEST_JOB_TIMEOUT_SECONDS: ${SEFORGE_LOAD_TEST_JOB_TIMEOUT_SECONDS:-120}
      SEFORGE_LOAD_TEST_SSE_QUESTION: ${SEFORGE_LOAD_TEST_SSE_QUESTION:-}
      SEFORGE_LOAD_TEST_REQUIRE_SSE_CITATION: ${SEFORGE_LOAD_TEST_REQUIRE_SSE_CITATION:-true}
      SEFORGE_LOAD_TEST_EXPECT_SSE_TERMINAL: ${SEFORGE_LOAD_TEST_EXPECT_SSE_TERMINAL:-done}
      SEFORGE_LOAD_TEST_JOB_PATH: ${SEFORGE_LOAD_TEST_JOB_PATH:-}
      SEFORGE_LOAD_TEST_JOB_BODY: ${SEFORGE_LOAD_TEST_JOB_BODY:-}
      SEFORGE_LOAD_TEST_CLASS_ID: ${SEFORGE_LOAD_TEST_CLASS_ID:-}
      SEFORGE_LOAD_TEST_INSECURE_TLS: ${SEFORGE_LOAD_TEST_INSECURE_TLS:-false}
    volumes:
      - ../../docs/load-test:/scripts:ro
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1G
        reservations:
          memory: 128M

  mysql:
    image: mysql:8.4.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-seforge}
      MYSQL_USER: ${MYSQL_APP_USERNAME:-seforge}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Set MYSQL_APP_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - name: mysql-local
        target: 3306
        published: "${MYSQL_HOST_PORT:-3307}"
        host_ip: 127.0.0.1
        protocol: tcp
        app_protocol: mysql
        mode: host
    networks:
      - data
      - host-access
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 --user="$${MYSQL_USER}" --password="$${MYSQL_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1G
        reservations:
          memory: 512M

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      - /bin/sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    ports:
      - name: redis-local
        target: 6379
        published: "${REDIS_HOST_PORT:-6380}"
        host_ip: 127.0.0.1
        protocol: tcp
        app_protocol: redis
        mode: host
    networks:
      - data
      - host-access
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-seforge-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Set MINIO_APP_SECRET_KEY in .env}
      MINIO_APP_BUCKET: ${MINIO_APP_BUCKET:-seforge}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing "local/$${MINIO_APP_BUCKET}"
        && (mc admin user info local "$${MINIO_APP_ACCESS_KEY}" >/dev/null 2>&1 || mc admin user add local "$${MINIO_APP_ACCESS_KEY}" "$${MINIO_APP_SECRET_KEY}")
        && printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::%s"]},{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::%s/*"]}]}' "$${MINIO_APP_BUCKET}" "$${MINIO_APP_BUCKET}" > /tmp/seforge-app-policy.json
        && (mc admin policy info local seforge-app >/dev/null 2>&1 || mc admin policy create local seforge-app /tmp/seforge-app-policy.json)
        && mc admin policy attach local seforge-app --user "$${MINIO_APP_ACCESS_KEY}"
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 32M

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
      - --snapshot-count=50000
    volumes:
      - etcd-data:/etcd
    networks:
      - data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M

  milvus:
    image: milvusdb/milvus:v2.5.14
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 4G
        reservations:
          memory: 1G

  sonar-postgres:
    image: postgres:17.4-alpine
    profiles: [review]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONAR_POSTGRES_DB:-sonarqube}
      POSTGRES_USER: ${SONAR_POSTGRES_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONAR_POSTGRES_PASSWORD:?Set SONAR_POSTGRES_PASSWORD in .env}
    volumes:
      - sonar-postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
        reservations:
          memory: 256M

  sonarqube:
    image: sonarqube:10.7.0-community
    profiles: [review]
    restart: unless-stopped
    depends_on:
      sonar-postgres:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:5432/${SONAR_POSTGRES_DB:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONAR_POSTGRES_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONAR_POSTGRES_PASSWORD:?Set SONAR_POSTGRES_PASSWORD in .env}
      SONAR_WEB_JAVAOPTS: -Xms256m -Xmx512m
      SONAR_CE_JAVAOPTS: -Xms256m -Xmx512m
      SONAR_SEARCH_JAVAOPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:${SONAR_HTTP_PORT:-9002}:9000"
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'
      interval: 20s
      timeout: 5s
      retries: 30
      start_period: 90s
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 3G
        reservations:
          memory: 1G

networks:
  edge: {}
  host-access: {}
  data:
    internal: true

volumes:
  app-data: {}
  mysql-data: {}
  redis-data: {}
  minio-data: {}
  etcd-data: {}
  milvus-data: {}
  sonar-postgres-data: {}
  sonar-data: {}
  sonar-extensions: {}
  sonar-logs: {}
