# TLS entry point + no host database ports. Supply CA-issued cert.pem/key.pem and rendered config.
services:
  frontend:
    ports: !override
      - "${SEFORGE_BIND_ADDRESS:-0.0.0.0}:${SEFORGE_HTTPS_PORT:-443}:8443"
    volumes:
      - ${SEFORGE_TLS_CONFIG:?Set SEFORGE_TLS_CONFIG}:/etc/nginx/conf.d/default.conf:ro
      - ${SEFORGE_TLS_DIR:?Set SEFORGE_TLS_DIR}:/etc/nginx/tls:ro
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1:8443/healthz"]
  mysql:
    ports: !reset []
    networks: !override [data]
  redis:
    ports: !reset []
    networks: !override [data]
  sonarqube:
    ports: !reset []
  minio:
    ports: !reset []
    networks: !override [data]
  milvus:
    ports: !reset []
    networks: !override [data]
